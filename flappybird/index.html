
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flappy Bird | Mini Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <main class="game-page">
        <header class="game-header">
            <h1>Flappy Bird</h1>
        </header>

        <section class="game-card" aria-label="Trò chơi Flappy Bird">
            <div id="container">
                <div class="game-best-score"><span>HIGH SCORE</span><strong id="best_score">0</strong></div>
                <div id="bird"></div>

                <div id="pole_1" class="pole"></div>
                <div id="pole_2" class="pole"></div>

                <button id="play_btn" type="button">
                    <span class="play-prompt">SẴN SÀNG BAY?</span>
                    <span class="play-instruction">Chạm màn hình hoặc nhấn phím để bắt đầu</span>
                    <span class="play-action">BẮT ĐẦU CHƠI</span>
                </button>

                <span id="level">LEVEL 1</span>
                <span id="score">0</span>
                <div id="level-up-notice" role="status" aria-live="polite"></div>

                <div id="result_screen">
                    <div class="result_box">
                        <p class="result-eyebrow">VÁN CHƠI KẾT THÚC</p>
                        <h2 id="result_title">GAME OVER!</h2>
                        <p class="result-label">ĐIỂM CỦA BẠN</p>
                        <h3 id="final_score">0</h3>
                        <p class="result-level" id="final_level">Level 1</p>
                        <button id="result_restart_btn" type="button">CHƠI LẠI</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <script src="js/script.js"></script>
</body>

</html>
